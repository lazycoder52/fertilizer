name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Code Quality, Security & Model Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff Check)
        run: |
          ruff check .

      - name: Code Formatting Check (Ruff Format)
        run: |
          ruff format --check .

      - name: Dependency Security Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Run Pytest Suite with Model Quality Gate & Coverage >= 80%
        run: |
          pytest -v --cov=src/fertilizer_app --cov-report=term-missing --cov-fail-under=80
