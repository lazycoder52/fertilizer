<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%" style="background:#0b1120; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="negGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Main Card -->
  <rect x="20" y="20" width="780" height="380" rx="14" fill="#131d33" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="45" y="55" fill="#f8fafc" font-size="18" font-weight="700">🌱 Model Output &amp; Local TreeSHAP Explainability</text>
  <rect x="630" y="38" width="145" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="702" y="55" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">54.7% Confidence</text>

  <!-- Recommendation Box -->
  <rect x="45" y="75" width="730" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="100" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.8">RECOMMENDATION</text>
  <text x="65" y="125" fill="#ffffff" font-size="20" font-weight="700">DAP (Diammonium Phosphate)</text>
  <text x="290" y="123" fill="#94a3b8" font-size="12">Top-3: DAP (54.7%), Urea (40.5%), MOP (4.8%)</text>

  <!-- SHAP Section Heading -->
  <text x="45" y="165" fill="#e2e8f0" font-size="14" font-weight="600">Feature Attribution Drivers (Why this recommendation?)</text>
  <text x="700" y="165" fill="#64748b" font-size="11" text-anchor="end">Shapley values (Δ log-odds / prob)</text>

  <!-- Feature 1: Phosphorous (+0.455) -->
  <text x="45" y="195" fill="#cbd5e1" font-size="13" font-weight="500">Phosphorous (P = 45.0 kg/ha)</text>
  <text x="775" y="195" fill="#34d399" font-size="12" font-weight="700" text-anchor="end">+0.455</text>
  <rect x="45" y="202" width="730" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="45" y="202" width="560" height="7" rx="3.5" fill="url(#posGrad)"/>

  <!-- Feature 2: Nitrogen (-0.254) -->
  <text x="45" y="235" fill="#cbd5e1" font-size="13" font-weight="500">Nitrogen (N = 50.0 kg/ha)</text>
  <text x="775" y="235" fill="#f87171" font-size="12" font-weight="700" text-anchor="end">-0.254</text>
  <rect x="45" y="242" width="730" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="45" y="242" width="310" height="7" rx="3.5" fill="url(#negGrad)"/>

  <!-- Feature 3: Potassium (+0.061) -->
  <text x="45" y="275" fill="#cbd5e1" font-size="13" font-weight="500">Potassium (K = 40.0 kg/ha)</text>
  <text x="775" y="275" fill="#34d399" font-size="12" font-weight="700" text-anchor="end">+0.061</text>
  <rect x="45" y="282" width="730" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="45" y="282" width="75" height="7" rx="3.5" fill="url(#posGrad)"/>

  <!-- Feature 4: Soil Type (-0.051) -->
  <text x="45" y="315" fill="#cbd5e1" font-size="13" font-weight="500">Soil Type (Loamy Soil)</text>
  <text x="775" y="315" fill="#f87171" font-size="12" font-weight="700" text-anchor="end">-0.051</text>
  <rect x="45" y="322" width="730" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="45" y="322" width="62" height="7" rx="3.5" fill="url(#negGrad)"/>

  <!-- Feature 5: Soil pH (-0.023) -->
  <text x="45" y="355" fill="#cbd5e1" font-size="13" font-weight="500">Soil pH (6.5)</text>
  <text x="775" y="355" fill="#f87171" font-size="12" font-weight="700" text-anchor="end">-0.023</text>
  <rect x="45" y="362" width="730" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="45" y="362" width="30" height="7" rx="3.5" fill="url(#negGrad)"/>

  <!-- Footer note -->
  <text x="45" y="388" fill="#64748b" font-size="11">Calculated via shap.TreeExplainer in 3.8 ms • TreeSHAP exact tree traversal</text>
</svg>
